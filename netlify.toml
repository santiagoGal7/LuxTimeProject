[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/catalog.html"
  to = "/catalogo"
  status = 301
  force = true

[[redirects]]
  from = "/history.html"
  to = "/historia"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contacto"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/detail-classic.html"
  to = "/producto/reloj-clasico"
  status = 301
  force = true

[[redirects]]
  from = "/detail-elegance.html"
  to = "/producto/reloj-elegance"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/historia"
  status = 301
  force = true

[[redirects]]
  from = "/nosotros"
  to = "/historia"
  status = 301
  force = true
